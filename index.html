  --ink:#1A1410; --navy:#E8500A; --royal:#E8500A; --gold:#FF7A22; --gold2:#FFC37A; --gold-soft:#FFF0E3;
  --bg:#F8F5F2; --card:#fff; --line:#EDE6DF; --mute:#7B6E64; --ok:#168A5B; --bad:#C93B2B; --warn:#B7791F;
  --r:16px; --sh:0 10px 30px rgba(26,16,10,.10); color-scheme:light;
  --hero-from:#150C07; --hero-to:#A8400A; --foot:#120B07; --ann:#3B1A0B;
  --font:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--ink:#F6EFE9; --navy:#FF7A22; --royal:#F0620F; --gold:#FF9340; --gold2:#FFC37A; --gold-soft:#3A2314; --bg:#120D0A; --card:#1D1612; --line:#35291F; --mute:#B5A79B; --ok:#3FB584; --bad:#F0705F; --warn:#E3B04B; --sh:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme=dark]{--ink:#F6EFE9; --navy:#FF7A22; --royal:#F0620F; --gold:#FF9340; --gold2:#FFC37A; --gold-soft:#3A2314; --bg:#120D0A; --card:#1D1612; --line:#35291F; --mute:#B5A79B; --ok:#3FB584; --bad:#F0705F; --warn:#E3B04B; --sh:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;background:var(--royal);color:#fff;padding:12px 20px;font-weight:600;transition:transform .15s,box-shadow .2s,filter .2s;text-decoration:none}
.btn:hover{filter:brightness(1.08);box-shadow:0 6px 18px rgba(232,80,10,.3)}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2A1100}
.btn.gold:hover{box-shadow:0 8px 22px rgba(255,122,34,.5)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{box-shadow:none;background:var(--bg)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:7px 13px;font-size:14px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.spin{width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
select,input[type=text],input[type=number],input[type=password],input[type=tel],input[type=email],textarea{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;width:100%;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{outline:0;border-color:var(--royal);box-shadow:0 0 0 4px color-mix(in srgb,var(--royal) 18%,transparent)}
textarea{min-height:84px;resize:vertical}
.f{margin:12px 0}
.f label{display:block;font-size:14px;color:var(--mute);margin-bottom:5px;font-weight:500}
.two{display:grid;gap:0 14px}
@media (min-width:560px){.two{grid-template-columns:1fr 1fr}}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.row.t{font-weight:700;font-size:18px;border-top:1px dashed var(--line);margin-top:8px;padding-top:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{background:var(--gold-soft);border-radius:12px;padding:11px 14px;font-size:14px;margin:10px 0}
.err{color:var(--bad);font-size:14px;margin-top:8px;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.badge{display:inline-block;border-radius:999px;padding:2px 11px;font-size:13px;font-weight:600;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.badge.pending{color:var(--warn)} .badge.confirmed{color:var(--royal)} .badge.shipped{color:#8456d8} .badge.delivered{color:var(--ok)} .badge.cancelled{color:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(14,8,4,.62);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@media (min-width:760px){.ov{align-items:center}}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px;position:relative;animation:sheetIn .32s cubic-bezier(.2,.9,.3,1.1)}
@media (min-width:760px){.sheet{border-radius:24px}}
@keyframes sheetIn{from{transform:translateY(40px) scale(.97);opacity:0}}
.sheet.wide{max-width:880px}
.sheet h2{margin:0 0 14px;font-size:21px;padding-right:44px}
.x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:17px;z-index:3;transition:transform .2s}
.x:hover{transform:rotate(90deg)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;z-index:90;font-size:15px;box-shadow:var(--sh);animation:toastIn .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes toastIn{from{transform:translate(-50%,30px);opacity:0}}
.empty{text-align:center;color:var(--mute);padding:44px 12px}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:54px}
.low{color:var(--bad);font-weight:600}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

#pre{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 40%,#2B1409,#120B07);display:grid;place-content:center;justify-items:center;gap:20px;color:#FFC37A;transition:opacity .6s,visibility .6s;animation:preOut .6s 3.2s forwards}
#pre.out{opacity:0;visibility:hidden}
@keyframes preOut{to{opacity:0;visibility:hidden}}
.pl{position:relative;width:120px;height:120px}
.pl img{width:100%;height:100%;border-radius:50%;animation:plPop 1.1s cubic-bezier(.2,.9,.3,1.3) both}
.pl i{position:absolute;inset:-12px;border-radius:50%;border:3px solid transparent;border-top-color:#FF7A22;border-right-color:#FFC37A;animation:rot 1s linear infinite}
@keyframes plPop{from{transform:scale(.3) rotate(-35deg);opacity:0}}
#pre p{margin:0;letter-spacing:.5px;font-size:15px;opacity:.85;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}

.pls{animation:pls .5s}
@keyframes pls{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--royal) 55%,transparent);transform:scale(.94)}100%{box-shadow:0 0 0 16px transparent;transform:none}}
.spk{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:150}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes lpulse{50%{transform:scale(1.14)}}
@keyframes lbounce{0%,60%,100%{transform:none}30%{transform:translateY(-10px)}}
@keyframes lglow{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--gold) 35%,transparent),0 0 22px color-mix(in srgb,var(--gold) 70%,transparent)}}
@keyframes swing{25%{transform:rotate(12deg)}75%{transform:rotate(-12deg)}}
html[data-la=float] :is(.brand,.sbrand) .logo{animation:float 3s ease-in-out infinite}
html[data-la=spin] :is(.brand,.sbrand) .logo{animation:rot 10s linear infinite}
html[data-la=pulse] :is(.brand,.sbrand) .logo{animation:lpulse 2s ease-in-out infinite}
html[data-la=bounce] :is(.brand,.sbrand) .logo{animation:lbounce 1.8s infinite}
html[data-la=glow] :is(.brand,.sbrand) .logo{animation:lglow 2.2s ease-in-out infinite}
html[data-la=swing] :is(.brand,.sbrand) .logo{animation:swing 2.4s ease-in-out infinite;transform-origin:50% 0}
#pre[data-s=spin] .pl img{animation:rot 1.4s linear infinite}
#pre[data-s=bounce] .pl img{animation:lbounce 1s infinite}
#pre[data-s=fade] .pl img{animation:fade .9s both}
html[data-motion=off] *,html[data-motion=off] *::before,html[data-motion=off] *::after{animation:none!important;transition:none!important}
html[data-motion=off] .rv,html[data-motion=off] .card{opacity:1!important;transform:none!important}
html[data-rv=off] .rv,html[data-rv=off] .card{opacity:1!important;transform:none!important}
html[data-ptc=off] .ptc,html[data-orb=off] .orb,html[data-chipf=off] .chipf,html[data-prog=off] #prog,html[data-up=off] #up{display:none!important}
html[data-mq=off] .mq div{animation:none;padding-left:0;display:block;text-align:center}
html[data-mq=off] .mq span:nth-child(n+2){display:none}

/* ---- বাস্তবসম্মত প্রিমিয়াম লুক ---- */
.ph{background:linear-gradient(160deg,#F3EEE9,#DDD5CC);color:#8E7F72}
html[data-theme=dark] .ph{background:linear-gradient(160deg,#2B2521,#1E1916);color:#85786C}
.ph span{display:grid;place-items:center;width:100%;height:100%}
.ph svg{width:30%;max-width:56px;height:auto;opacity:.85}
.th .ph svg{width:46%}
.btn.gold{background:var(--royal);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.btn.gold:hover{box-shadow:0 8px 18px rgba(0,0,0,.2);filter:brightness(1.06)}
.btn{border-radius:10px}

.wrap{max-width:1200px;margin:0 auto;padding:0 18px}
/* marquee */
.mq{background:linear-gradient(90deg,color-mix(in srgb,var(--ann) 70%,#000),var(--ann),color-mix(in srgb,var(--ann) 70%,#000));color:#FFC37A;font-size:14px;overflow:hidden;white-space:nowrap;padding:8px 0}
.mq div{display:inline-block;padding-left:100%;animation:mq 26s linear infinite}
.mq span{margin-right:60px}
@keyframes mq{to{transform:translateX(-100%)}}
/* header */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:box-shadow .25s}
.top.sc{box-shadow:0 6px 24px rgba(26,16,10,.12)}
.bar{display:flex;align-items:center;gap:12px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;cursor:pointer;white-space:nowrap}
.logo{width:44px;height:44px;border-radius:50%;object-fit:cover;box-shadow:0 3px 12px rgba(232,80,10,.4);transition:transform .5s cubic-bezier(.2,.9,.3,1.4)}
.brand:hover .logo{transform:rotate(360deg) scale(1.08)}
.nav{display:none;gap:22px;margin-left:18px}
.nav a{color:var(--mute);text-decoration:none;font-weight:500;position:relative;padding:4px 0;cursor:pointer}
.nav a::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--gold);transition:width .25s}
.nav a:hover{color:var(--ink)} .nav a:hover::after{width:100%}
@media (min-width:900px){.nav{display:flex}}
.search{flex:1;min-width:0;position:relative}
.search input{height:44px;border-radius:999px;padding:0 18px 0 42px;background:var(--bg);border-color:transparent}
.search::before{content:"🔍";position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
.ib{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;flex:none;transition:transform .15s,background .2s}
.ib:hover{background:var(--bg)} .ib:active{transform:scale(.9)}
.cnt{position:absolute;top:-5px;right:-5px;min-width:21px;height:21px;border-radius:11px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2A1100;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.cnt.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.7)}60%{transform:scale(.9)}}
.ib.on{background:color-mix(in srgb,var(--bad) 14%,var(--card));border-color:var(--bad)}
/* hero */
.hero{position:relative;margin:18px 0 0;border-radius:28px;overflow:hidden;background:radial-gradient(900px 400px at 85% 0%,color-mix(in srgb,var(--gold) 38%,transparent),transparent 60%),linear-gradient(120deg,var(--hero-from),color-mix(in srgb,var(--hero-from) 55%,var(--hero-to)) 55%,var(--hero-to));color:#fff;display:grid;grid-template-columns:1fr;isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;z-index:-1;filter:blur(2px)}
.hero::before{width:320px;height:320px;left:-90px;bottom:-120px;background:radial-gradient(circle,rgba(255,195,122,.22),transparent 70%);animation:drift 9s ease-in-out infinite alternate}
.hero::after{width:220px;height:220px;right:30%;top:-70px;background:radial-gradient(circle,rgba(255,90,20,.25),transparent 70%);animation:drift 11s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(40px,-30px) scale(1.15)}}
.hero .txt{padding:34px 24px 6px}
.hero .kick{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,195,122,.4);color:var(--gold2);border-radius:999px;padding:5px 14px;font-size:14px}
.hero h1{margin:14px 0 12px;font-size:clamp(30px,7vw,56px);line-height:1.15;font-weight:700}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 0 22px;max-width:44ch;opacity:.88;font-size:17px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.hero .btn.ghost:hover{background:rgba(255,255,255,.1)}
.shine::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{left:130%}}
.hero .vis{position:relative;height:340px;display:flex;justify-content:center;align-items:flex-end;padding-top:20px}
.arch{position:relative;width:min(270px,70%);height:100%;border-radius:200px 200px 22px 22px;overflow:hidden;border:3px solid rgba(255,195,122,.7);box-shadow:0 30px 60px rgba(0,0,0,.45);animation:rise 1s cubic-bezier(.2,.8,.2,1) .3s both}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;animation:kb 12s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.08) translateY(-1.5%)}}
@keyframes rise{from{transform:translateY(60px);opacity:0}}
.chipf{position:absolute;background:rgba(255,255,255,.95);color:#1A1410;border-radius:14px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 12px 28px rgba(0,0,0,.3);animation:float 4s ease-in-out infinite}
.chipf.a{left:4%;top:20%} .chipf.b{right:4%;bottom:22%;animation-delay:-2s}
@keyframes float{50%{transform:translateY(-10px)}}
.hero .txt>*{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.hero .txt>:nth-child(2){animation-delay:.1s}.hero .txt>:nth-child(3){animation-delay:.2s}.hero .txt>:nth-child(4){animation-delay:.3s}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (min-width:860px){.hero{grid-template-columns:1.15fr 1fr;min-height:480px}.hero .txt{padding:64px 48px;align-self:center}.hero .vis{height:auto}.arch{width:min(340px,78%)}}
/* perks */
.perks{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:22px 0}
@media (min-width:860px){.perks{grid-template-columns:repeat(4,1fr)}}
.perk{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:13.5px;color:var(--mute);transition:transform .2s,box-shadow .2s}
.perk:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.perk i{font-style:normal;font-size:26px;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--gold-soft);flex:none}
.perk b{display:block;color:var(--ink);font-size:15px}
/* sections */
.sec{margin:34px 0 14px}
.sec h2{margin:0;font-size:clamp(22px,4vw,30px)}
.sec p{margin:2px 0 0;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile{border:0;border-radius:20px;padding:20px 16px;min-height:132px;text-align:left;color:#fff;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.tile:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 16px 30px rgba(26,16,10,.25)}
.tile span{position:absolute;right:-6px;bottom:-12px;font-size:76px;opacity:.9;transition:transform .35s}
.tile:hover span{transform:scale(1.15) rotate(-8deg)}
.tile b{display:block;font-size:19px}.tile small{opacity:.85}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;transition:all .2s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:scale(1.04)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 0 14px;color:var(--mute);font-size:14px}
.tools select{width:auto;padding:8px 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:760px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media (min-width:1040px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;opacity:0;transform:translateY(22px);transition:opacity .55s,transform .55s,box-shadow .3s;transition-delay:calc(var(--i,0)*60ms)}
.card.in{opacity:1;transform:none}
.card.in:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(26,16,10,.16);transition-delay:0s}
.card .pic{position:relative;aspect-ratio:4/5;background:var(--bg);overflow:hidden}
.card .pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.card:hover .pic img,.card:hover .ph{transform:scale(1.08)}
.ph{transition:transform .6s}
.tag{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2A1100;font-size:12px;font-weight:700;border-radius:8px;padding:3px 9px;z-index:1}
.tag.out{left:auto;right:10px;background:var(--ink);color:var(--bg);top:auto;bottom:10px}
.heart{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#222;font-size:17px;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.18);transition:transform .2s}
.heart:hover{transform:scale(1.15)} .heart.on{color:#E0344B;animation:pop .45s}
@keyframes pop{40%{transform:scale(1.5)}}
.quick{position:absolute;left:10px;right:10px;bottom:10px;border:0;border-radius:12px;background:rgba(26,16,10,.92);color:#fff;padding:9px;font-weight:600;transform:translateY(130%);transition:transform .3s}
.card:hover .quick{transform:none}
@media (hover:none){.quick{display:none}}
.info{padding:12px 14px 16px}
.info .cat{font-size:12px;color:var(--mute)}
.info h3{margin:2px 0 6px;font-size:16px;line-height:1.35;font-weight:600}
.pr b{font-size:18px;color:var(--royal)} @media (prefers-color-scheme:dark){.pr b{color:var(--gold2)}}
.pr s{color:var(--mute);margin-left:8px;font-size:14px}
.sk{height:300px;border-radius:20px;background:linear-gradient(100deg,var(--line) 30%,var(--card) 50%,var(--line) 70%);background-size:300% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-100% 0}}
.promo{margin:40px 0 0;border-radius:24px;padding:28px;background:linear-gradient(120deg,var(--hero-from),var(--hero-to));color:#fff;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:relative;overflow:hidden}
.promo::after{content:"%";position:absolute;right:20px;top:-40px;font-size:200px;font-weight:700;color:rgba(255,195,122,.12)}
.promo h3{margin:0 0 4px;font-size:24px}.promo code{background:rgba(255,255,255,.14);border:1.5px dashed var(--gold2);color:var(--gold2);padding:6px 16px;border-radius:10px;font-size:20px;font-weight:700;letter-spacing:2px;cursor:pointer}
footer.ft{margin-top:50px;background:var(--foot);color:#C9B8AA;padding:44px 0 26px}
footer.ft .wrap{display:grid;gap:28px;grid-template-columns:1fr}
@media (min-width:760px){footer.ft .wrap{grid-template-columns:1.4fr 1fr 1fr}}
footer.ft h4{margin:0 0 10px;color:#fff}footer.ft a,footer.ft .lnk{color:inherit;text-decoration:none;cursor:pointer;display:block;padding:3px 0;background:none;border:0;text-align:left}

  renderShop();
  if(an.intro) setTimeout(() => { pre.classList.add('out'); setTimeout(() => pre.remove(), 800); }, Math.max(0, (+an.introSec || 1.3) * 1000 - performance.now()));
  let busy = false;   // অ্যাডমিনের পরিবর্তন সবার ফোনে নিজে থেকে আসে (প্রতি ২০ সেকেন্ডে)
  setInterval(async () => {
    if(document.hidden || busy) return; busy = true;
    try{
      const r = await api('GET', '/api/store?rev=' + db.rev);
      if(!r.same){ db = normalize({...r, users:[], orders:[]}); db.rev = r.rev; applyTheme(); if(!$('#layer').innerHTML.trim() && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) renderShop(); else window.__stale = true; }
      if(me){ await loadMe(); if(!me){ setMe(null, ''); toast('আপনার একাউন্ট থেকে লগআউট হয়েছে'); } }
    }catch(e){}
    busy = false;
  }, 20000);
})();
</script>
</body>
</html>
